name: gpui client

on:
  pull_request:
    paths: [native/t3-gpui/**, .github/workflows/gpui-client.yml]
  push:
    branches: [main, feat/gpui-client]
    paths: [native/t3-gpui/**, .github/workflows/gpui-client.yml]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/t3-gpui
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /native/t3-gpui/
            /.cargo/
          sparse-checkout-cone-mode: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/t3-gpui/target
          key: gpui-${{ runner.os }}-${{ hashFiles('native/t3-gpui/Cargo.lock') }}
          restore-keys: gpui-${{ runner.os }}-

      - run: cargo fmt -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
